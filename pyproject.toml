[project]
name = "copilot-studio-update-monitor"
version = "0.1.0"
description = "Configurable Microsoft Learn Copilot Studio documentation update digests."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "requests>=2.32.4,<3",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "pypdf>=6,<7",
    "pymupdf>=1.26,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
